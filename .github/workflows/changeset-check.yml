name: Changeset Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changeset:
    # The Changesets bot's "Version Packages" PR consumes the changeset files
    # while bumping package.json, so this guard would always fail on it.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # changeset status --since needs the base branch history to diff
          # against, so fetch the full history rather than a shallow clone.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails when a publishable package changed but no changeset was added.
      # Docs/CI-only PRs pass without one; use `pnpm changeset --empty` to
      # record an intentional no-release for a package-touching change.
      - name: Verify a changeset is present
        # BASE_REF goes through the environment rather than a `${{ }}` splice so
        # the ref name is never expanded into the shell command itself.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"
